<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!--
    Icon thanh hoạt động (activity bar) cho "AI Local" — bong bóng trò chuyện với 3 chấm (đang gõ).
