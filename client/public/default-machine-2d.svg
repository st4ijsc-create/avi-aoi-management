<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Machine Base -->
  <rect x="20" y="120" width="160" height="60" fill="#334155" stroke="#64748b" stroke-width="2" rx="4"/>
  
  <!-- Machine Body -->
  <rect x="30" y="60" width="140" height="70" fill="#475569" stroke="#64748b" stroke-width="2" rx="4"/>
  
  <!-- Control Panel -->
  <rect x="45" y="75" width="50" height="40" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="2"/>
  
  <!-- Screen -->
  <rect x="50" y="80" width="40" height="25" fill="#0ea5e9" stroke="#38bdf8" stroke-width="1" rx="1"/>
  <line x1="52" y1="85" x2="88" y2="85" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
  <line x1="52" y1="90" x2="85" y2="90" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
  <line x1="52" y1="95" x2="88" y2="95" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Buttons -->
  <circle cx="55" cy="112" r="3" fill="#22c55e"/>
  <circle cx="65" cy="112" r="3" fill="#ef4444"/>
  <circle cx="75" cy="112" r="3" fill="#eab308"/>
  <circle cx="85" cy="112" r="3" fill="#3b82f6"/>
  
  <!-- Mechanical Arm/Component -->
  <rect x="110" y="70" width="50" height="15" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <rect x="125" y="50" width="20" height="25" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <circle cx="135" cy="47" r="4" fill="#94a3b8"/>
  
  <!-- Conveyor Belt -->
  <rect x="25" y="130" width="150" height="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <circle cx="35" cy="134" r="3" fill="#475569"/>
  <circle cx="55" cy="134" r="3" fill="#475569"/>
  <circle cx="75" cy="134" r="3" fill="#475569"/>
  <circle cx="95" cy="134" r="3" fill="#475569"/>
  <circle cx="115" cy="134" r="3" fill="#475569"/>
  <circle cx="135" cy="134" r="3" fill="#475569"/>
  <circle cx="155" cy="134" r="3" fill="#475569"/>
  <circle cx="165" cy="134" r="3" fill="#475569"/>
  
  <!-- Ventilation/Details -->
  <line x1="115" y1="95" x2="155" y2="95" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="100" x2="155" y2="100" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="105" x2="155" y2="105" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="110" x2="155" y2="110" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="115" x2="155" y2="115" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  
  <!-- Warning Stripes -->
  <rect x="25" y="145" width="10" height="30" fill="#eab308" opacity="0.3"/>
  <rect x="165" y="145" width="10" height="30" fill="#eab308" opacity="0.3"/>
</svg>
