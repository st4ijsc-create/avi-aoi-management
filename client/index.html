  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SYNAPSE — Automation &amp; Manufacturing Operations Platform</title>

    <!-- PWA (Phase 5 WS5.1) -->

    <meta name="theme-color" content="#13a4a4" />

    <!-- KHÔNG có <link>/<script> nào trỏ ra CDN ngoài (giao thức https) trong vỏ app (Đợt 43, G117 / RB-5): nhà máy không có
         internet ổn định — một stylesheet render-blocking từ CDN ngoài = trang trắng tới khi CDN trả
         lời (đo 8–38 s). Geist / Geist Mono tự phục vụ ở client/src/fonts.css (@fontsource-variable,
         băm vào /assets/). Cổng: scripts/kiem-vo-app-https.test.ts (+ bước cuối npm run build). -->

    <!-- Suppress browser extension errors -->
    <script>
      // Suppress "message channel closed" errors from browser extensions
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && 
            event.reason.message && 
            event.reason.message.includes('message channel closed')) {
          event.preventDefault();
          // Optionally log for debugging
          // console.log('Suppressed extension error:', event.reason.message);
        }
      });
      
      // Suppress console errors from extensions
      const originalError = console.error;
      console.error = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('message channel closed') || 
            msg.includes('listener indicated an asynchronous response')) {
          return; // Suppress these errors
        }
        originalError.apply(console, args);
      };
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
