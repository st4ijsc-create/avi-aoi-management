<!doctype html>
<html lang="vi">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SYNAPSE — Automation &amp; Manufacturing Operations Platform</title>

    <!-- PWA (Phase 5 WS5.1) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#13a4a4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SYNAPSE" />
    <link rel="apple-touch-icon" href="/default-machine-2d.svg" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Geist font (matches --font-sans / --font-mono in index.css). Loading
         the actual font fixes Vietnamese diacritic rendering at small sizes
         in the AI tool-result cards and other UI surfaces; without this the
         browser silently falls back to system fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />

    <!-- Suppress browser extension errors -->
    <script>
      // Suppress "message channel closed" errors from browser extensions
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && 
            event.reason.message && 
            event.reason.message.includes('message channel closed')) {
          event.preventDefault();
          // Optionally log for debugging
          // console.log('Suppressed extension error:', event.reason.message);
        }
      });
      
      // Suppress console errors from extensions
      const originalError = console.error;
      console.error = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('message channel closed') || 
            msg.includes('listener indicated an asynchronous response')) {
          return; // Suppress these errors
        }
        originalError.apply(console, args);
      };
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
