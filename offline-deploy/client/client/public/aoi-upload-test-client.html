<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOI Package Upload Test Client</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 28px; margin-bottom: 10px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .content { padding: 30px; }
    .section {
      margin-bottom: 25px;
      padding: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .section h3 {
      margin-bottom: 15px;
      color: #333;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 10px;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .log-entry {
      margin: 3px 0;
      padding: 3px 0;
    }
    .log-entry.info { color: #4fc3f7; }
    .log-entry.success { color: #66bb6a; }
    .log-entry.error { color: #ef5350; }
    .log-entry.warning { color: #ffa726; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .stat-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .stat-card h4 {
      color: #666;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .stat-card .value {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    .status-badge.connected {
      background: #66bb6a;
      color: white;
    }
    .status-badge.disconnected {
      background: #ef5350;
      color: white;
    }
    .icon { font-size: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 AOI Package Upload Test Client</h1>
      <p>Test công cụ upload ảnh AOI từ máy kiểm tra sang server AVI</p>
    </div>

    <div class="content">
      <!-- Configuration Section -->
      <div class="section">
        <h3><span class="icon">⚙️</span> Configuration</h3>
        <div class="form-group">
          <label>Server URL:</label>
          <input type="text" id="serverUrl" value="http://172.16.1.250:3001" placeholder="http://172.16.1.250:3001">
        </div>
        <div class="form-group">
          <label>API Key:</label>
          <input type="text" id="apiKey" value="avi_2642fa98f019d20aacac728270556d11204ebb7aaca2fdd6" placeholder="avi_xxx...">
        </div>
        <div class="form-group">
          <label>Machine Code:</label>
          <input type="text" id="machineCode" value="FAC-HN-DIP-B-ST3-AOI" placeholder="FAC-HN-DIP-B-ST3-AOI">
        </div>
        <button onclick="testConnection()">🔌 Test Connection</button>
      </div>

      <!-- Upload Section -->
      <div class="section">
        <h3><span class="icon">📤</span> Upload Inspection Package</h3>
        <div class="form-group">
          <label>Serial Number:</label>
          <input type="text" id="serialNumber" placeholder="SN-20260210-1234">
        </div>
        <div class="form-group">
          <label>Result:</label>
          <select id="result" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
            <option value="NG">NG (Fail)</option>
            <option value="OK">OK (Pass)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Number of Images:</label>
          <input type="number" id="numImages" value="5" min="1" max="20">
        </div>
        <button onclick="uploadPackage()" id="uploadBtn">🚀 Upload Package</button>
      </div>

      <!-- Stats Section -->
      <div class="section">
        <h3><span class="icon">📊</span> Statistics</h3>
        <div class="stats">
          <div class="stat-card">
            <h4>Total Uploads</h4>
            <div class="value" id="totalUploads">0</div>
          </div>
          <div class="stat-card">
            <h4>Success</h4>
            <div class="value" style="color: #66bb6a;" id="successCount">0</div>
          </div>
          <div class="stat-card">
            <h4>Failed</h4>
            <div class="value" style="color: #ef5350;" id="failCount">0</div>
          </div>
          <div class="stat-card">
            <h4>Total Size</h4>
            <div class="value" style="color: #ffa726; font-size: 18px;" id="totalSize">0 KB</div>
          </div>
        </div>
      </div>

      <!-- Log Section -->
      <div class="section">
        <h3><span class="icon">📋</span> Activity Log <button onclick="clearLog()" style="width: auto; padding: 6px 15px; font-size: 12px; margin: 0 0 0 10px;">Clear</button></h3>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <script>
    let stats = {
      total: 0,
      success: 0,
      fail: 0,
      totalBytes: 0
    };

    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString('vi-VN');
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      
      const icon = {
        info: '·',
        success: '✔',
        error: '✕',
        warning: '⚠',
        request: '⇄',
        arrow: '→',
        response: '←',
        build: '▸'
      };
      
      entry.textContent = `${timestamp}\n${icon[type] || '·'}\n${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    function updateStats() {
      document.getElementById('totalUploads').textContent = stats.total;
      document.getElementById('successCount').textContent = stats.success;
      document.getElementById('failCount').textContent = stats.fail;
      document.getElementById('totalSize').textContent = (stats.totalBytes / 1024).toFixed(1) + ' KB';
    }

    async function testConnection() {
      const serverUrl = document.getElementById('serverUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const machineCode = document.getElementById('machineCode').value.trim();

      log(`Testing ${serverUrl} ...`);
      log(`API Key: ${apiKey}`);
      log(`Machine: ${machineCode}`);

      try {
        log(`POST /api/trpc/aoiPackage.reportQueueMetrics (test ping)`, 'request');
        
        const response = await fetch(`${serverUrl}/api/trpc/aoiPackage.reportQueueMetrics`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            apiKey: apiKey,
            machineCode: machineCode,
            queueSize: 0,
            pendingBytes: 0
          })
        });

        if (response.ok) {
          log(`Connected ✔ — API Key accepted, machine registered`, 'success');
        } else {
          const text = await response.text();
          log(`Connection failed: ${response.status} ${response.statusText}\n${text}`, 'error');
        }
      } catch (error) {
        log(`Connection error: ${error.message}`, 'error');
      }
    }

    function generateMockImage() {
      // Create a small PNG image (1x1 pixel)
      const canvas = document.createElement('canvas');
      canvas.width = 100;
      canvas.height = 100;
      const ctx = canvas.getContext('2d');
      
      // Random color
      ctx.fillStyle = `rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
      ctx.fillRect(0, 0, 100, 100);
      
      return canvas.toDataURL('image/png').split(',')[1]; // base64
    }

    async function uploadPackage() {
      const serverUrl = document.getElementById('serverUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const machineCode = document.getElementById('machineCode').value.trim();
      const serialNumber = document.getElementById('serialNumber').value.trim() || `SN-${Date.now()}`;
      const result = document.getElementById('result').value;
      const numImages = parseInt(document.getElementById('numImages').value) || 5;

      if (!serverUrl || !apiKey || !machineCode) {
        log('Please fill in all configuration fields', 'error');
        return;
      }

      const inspectionId = `INS-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${String(stats.total + 1).padStart(3, '0')}`;

      log(`[${machineCode}] New: ${inspectionId} | SN:${serialNumber} | ${result} (${numImages} pts)`);
      log(`[${machineCode}] Building ZIP: ${serialNumber} (${numImages} images)...`, 'build');

      try {
        // Create mock ZIP (just concatenate some data)
        const JSZip = window.JSZip || null;
        let zipBlob;
        
        if (JSZip) {
          // If JSZip is available
          const zip = new JSZip();
          
          // Add meta.json
          zip.file('meta.json', JSON.stringify({
            inspectionId: inspectionId,
            serialNumber: serialNumber,
            result: result,
            timestamp: new Date().toISOString(),
            machineCode: machineCode,
            images: Array.from({length: numImages}, (_, i) => ({
              filename: `image_${i+1}.png`,
              defectType: result === 'NG' ? ['scratch', 'chip', 'crack'][i % 3] : null,
              x: Math.random() * 1000,
              y: Math.random() * 1000
            }))
          }, null, 2));
          
          // Add images
          for (let i = 0; i < numImages; i++) {
            const imageData = generateMockImage();
            zip.file(`image_${i+1}.png`, imageData, {base64: true});
          }
          
          zipBlob = await zip.generateAsync({type: 'blob', compression: 'STORE'});
        } else {
          // Fallback: create simple blob
          const mockData = JSON.stringify({
            inspectionId,
            serialNumber,
            result,
            images: numImages
          });
          zipBlob = new Blob([mockData], {type: 'application/octet-stream'});
        }

        const sizeBytes = zipBlob.size;
        log(`[${machineCode}] ZIP ready: ${(sizeBytes/1024).toFixed(1)}KB (${sizeBytes} bytes, STORE mode)`);

        // Step 1: Presign
        log(`[${machineCode}] POST /api/trpc/aoiPackage.presign`, 'request');
        log(`→ { apiKey:"${apiKey}", inspectionId:"${inspectionId}", sizeBytes:${sizeBytes} }`, 'arrow');

        const presignResponse = await fetch(`${serverUrl}/api/trpc/aoiPackage.presign`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            apiKey: apiKey,
            inspectionId: inspectionId,
            sizeBytes: sizeBytes
          })
        });

        if (!presignResponse.ok) {
          const errorText = await presignResponse.text();
          throw new Error(`Presign failed: ${presignResponse.status} - ${errorText}`);
        }

        const presignData = await presignResponse.json();
        const uploadUrl = presignData.result?.data?.uploadUrl;
        const packageId = presignData.result?.data?.packageId;

        if (presignData.result?.data?.alreadyCommitted) {
          log(`[${machineCode}] alreadyCommitted:true — idempotent skip`, 'warning');
          return;
        }

        log(`[${machineCode}] ← { success:true, packageId:"${packageId}", uploadUrl:"${uploadUrl}" }`, 'response');
        log(`objectKey: ${presignData.result?.data?.objectKey || 'N/A'}`);

        // Step 2: Upload
        log(`[${machineCode}] PUT ${uploadUrl} (${(sizeBytes/1024).toFixed(1)}KB)`, 'request');
        log(`Headers: Content-Type:application/octet-stream, X-API-Key:${apiKey}, X-Machine-Code:${machineCode}`);

        const uploadResponse = await fetch(`${serverUrl}${uploadUrl}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/octet-stream',
            'X-API-Key': apiKey,
            'X-Machine-Code': machineCode
          },
          body: zipBlob
        });

        if (!uploadResponse.ok) {
          const errorText = await uploadResponse.text();
          throw new Error(`Upload failed: ${uploadResponse.status} - ${errorText}`);
        }

        const uploadData = await uploadResponse.json();
        log(`[${machineCode}] Upload success: ${JSON.stringify(uploadData)}`, 'success');

        // Step 3: Commit
        log(`[${machineCode}] POST /api/trpc/aoiPackage.commit`, 'request');

        const commitResponse = await fetch(`${serverUrl}/api/trpc/aoiPackage.commit`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            apiKey: apiKey,
            packageId: packageId
          })
        });

        if (!commitResponse.ok) {
          const errorText = await commitResponse.text();
          throw new Error(`Commit failed: ${commitResponse.status} - ${errorText}`);
        }

        const commitData = await commitResponse.json();
        log(`[${machineCode}] Commit success! Package processed.`, 'success');
        log(`→ Images extracted: ${commitData.result?.data?.imageCount || 0}`, 'success');

        // Update stats
        stats.total++;
        stats.success++;
        stats.totalBytes += sizeBytes;
        updateStats();

      } catch (error) {
        log(`[${machineCode}] ERROR: ${error.message}`, 'error');
        stats.total++;
        stats.fail++;
        updateStats();
      }
    }

    // Auto-test on load
    window.addEventListener('load', () => {
      log('AOI Upload Test Client loaded ✓', 'success');
      log('Ready to test. Click "Test Connection" to verify server connectivity.');
    });
  </script>

  <!-- Optional: Include JSZip for real ZIP creation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
