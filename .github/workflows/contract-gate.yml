# Contract BACKWARD gate — SYNAPSE §5.6.4/§9.1 (doc 33 I6 · F7).
# Runs the schema BACKWARD-compat gate + contract tests on any PR that touches contracts,
# so a breaking schema change is caught before merge (a topic must bump to …/v2 instead).
name: contract-gate

on:
  pull_request:
    paths:
      - "server/services/contracts/**"
      - "server/contracts/**"
      - "shared/plugin/**"
      - "shared/**"
  workflow_dispatch: {}

jobs:
  schema-backward-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (no scripts)
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Schema BACKWARD gate + contract tests
        run: pnpm vitest run server/services/contracts/
      - name: Plugin manifest apiVersion gate
        run: pnpm vitest run server/services/plugins/manifest.test.ts
