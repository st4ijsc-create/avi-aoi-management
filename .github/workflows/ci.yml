name: CI

on:
  push:
    branches: [main, VPMS]
  pull_request:
    branches: [main, VPMS]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-sync-build:
    name: DB push & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avi_aoi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d avi_aoi_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avi_aoi_db
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Database push (generate + migrate)
        run: pnpm db:push

      - name: Build app
        run: pnpm run build

  build-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # depth 2 → HEAD~1 exists, so the contract BACKWARD gate can diff vs the parent/base
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Contract schema BACKWARD gate (doc 44 G2.5)
        run: node scripts/contracts-compat-check.mjs

      - name: Unit tests (vitest)
        run: pnpm test

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 25
    env:
      NODE_ENV: production
      PORT: "3000"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app
        run: pnpm run build

      - name: Start server (background) & wait for /health
        run: |
          node dist/index.js &
          echo $! > .server.pid
          npx --yes wait-on -t 60000 http://localhost:3000/health

      - name: Run smoke specs
        run: pnpm run test:e2e

      - name: Stop server
        if: always()
        run: |
          if [ -f .server.pid ]; then kill "$(cat .server.pid)" 2>/dev/null || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: synapse-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
