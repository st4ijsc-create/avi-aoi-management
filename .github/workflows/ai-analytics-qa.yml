name: AI Analytics QA Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ai-analytics-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI analytics unit tests
        run: pnpm test server/aiInspectionAnalytics.test.ts server/aiInspectionAnalyticsRouter.test.ts server/aiReportGenerator.test.ts server/rateLimitConfig.test.ts server/exportWorkflow.test.ts

      - name: Type check (known TS5103 is expected for ignoreDeprecations=6.0)
        shell: bash
        run: |
          set +e
          pnpm run check > check.log 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Type check passed."
            exit 0
          fi

          if grep -q "Invalid value for '--ignoreDeprecations'" check.log; then
            echo "::warning::Known issue: tsconfig ignoreDeprecations=6.0 is expected to fail until tsconfig/TS policy is updated."
            exit 0
          fi

          echo "Type check failed with unexpected errors:"
          cat check.log
          exit 1

      - name: Build
        run: pnpm build
