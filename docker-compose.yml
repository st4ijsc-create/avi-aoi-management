services:
  # ── Cơ sở dữ liệu chính (TimescaleDB + pgvector) ────────────────────────────
  # Doc 27 §11 quyết định #1: TimescaleDB BẮT BUỘC trên DB CHÍNH (hypertable cho
  # product_inspections / measurement_results / telemetry — migration 0172/0173).
  # Image timescale/timescaledb-ha:pg17 có SẴN CẢ timescaledb LẪN pgvector, nên
  # vừa thỏa 0121 (EXTENSION vector + HNSW cho RAG) vừa thỏa 0172 (hypertables).
  # ⚠️ ĐỔI IMAGE = ĐỔI MAJOR/DATA-DIR: volume PG16 cũ (`pgdata`) KHÔNG dùng lại
  #   trực tiếp được — dump/restore theo runbook scripts/migrate-to-timescaledb.md.
  #   Volume mới `pgdata_ts` mount vào /home/postgres/pgdata/data (PGDATA của
  #   image timescaledb-ha, khác image postgres chuẩn).
  postgres:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aoi}
      POSTGRES_DB: ${POSTGRES_DB:-aoi_management}
    volumes:
      - pgdata_ts:/home/postgres/pgdata/data
      # Tạo extension `vector` + `timescaledb` ngay khi init volume (trước mọi migration).
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aoi} -d ${POSTGRES_DB:-aoi_management}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # G1 — Broker MQTT HA (UNS / Sparkplug B). Cổng map lệch để tránh đụng aedes nội bộ (1883/8883).
  emqx:
    image: emqx/emqx:5.8
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: aviaoiemqx
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    volumes:
      - emqxdata:/opt/emqx/data
    ports:
      - "1884:1883"    # MQTT TCP  (host 1884 -> container 1883)
      - "8084:8083"    # MQTT over WebSocket
      - "18083:18083"  # Dashboard UI
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── NATS JetStream — durable log cho tầng streaming W4 (doc 44 G2.7) ────────
  # Quyết định D2 (doc 44 §12): NATS JetStream TRƯỚC, Kafka CHỈ KHI Site Edition
  # cần scale vượt NATS. Đây là hạ tầng TÙY CHỌN theo kiến trúc "gập được":
  # nằm dưới compose profile `bus` → `docker compose up` mặc định KHÔNG chạy nó
  # (single-node giữ nguyên gọn nhẹ, không thêm container nào).
  #   Bật:    docker compose --profile bus up -d nats
  #   Kiểm:   curl http://localhost:8222/healthz   → {"status":"ok"}
  # Vai trò (W4): bridge MQTT→NATS, consumer group, replay/backfill idempotent —
  # app CHƯA có client NATS (wire ở SYN-W4); env dự kiến NATS_URL=nats://localhost:4222.
  nats:
    image: nats:2.10-alpine
    profiles: ["bus"]
    restart: unless-stopped
    # -js = bật JetStream (stream/consumer bền) · -sd = store dir trên volume bền
    # -m 8222 = HTTP monitoring (/healthz /varz /jsz) · --server_name để lg/cluster rõ tên
    command: ["-js", "-sd", "/data", "-m", "8222", "--server_name", "avi-nats-1"]
    volumes:
      - natsdata:/data
    ports:
      - "4222:4222"   # client (NATS protocol)
      - "8222:8222"   # monitoring HTTP (healthz/varz/jsz — KHÔNG phải Prometheus format)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # G1/G3 — TimescaleDB cho time-series (energy_readings). Cổng host 5433 để KHÔNG đụng PG16 chính (5432).
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TSDB_USER:-tsdb}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-tsdb_pass}
      POSTGRES_DB: ${TSDB_NAME:-avi_aoi_ts}
    volumes:
      - tsdbdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_USER:-tsdb} -d ${TSDB_NAME:-avi_aoi_ts}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Migration một lần (main PG): apply 143 file drizzle/*.sql rồi thoát. ────
  # App chỉ khởi động SAU khi service này exit 0 (depends_on … service_completed_successfully).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-aoi}:${POSTGRES_PASSWORD:-aoi}@postgres:5432/${POSTGRES_DB:-aoi_management}
    entrypoint: ["/bin/sh", "-c"]
    # Áp dụng migration rồi XÁC MINH schema cốt lõi. Một số file MySQL-legacy đã chết
    # (backtick) + vài file idempotent sẽ báo "failed" — đó là hành vi lenient có chủ đích
    # của migrate-standalone, KHÔNG chặn app. Chỉ fail nếu bảng cốt lõi thực sự thiếu.
    command:
      - |
        node scripts/migrate-standalone.mjs || echo "[migrate] một số file legacy/idempotent báo lỗi (dự kiến) — đang xác minh schema cốt lõi...";
        ok=$$(psql "$$DATABASE_URL" -tAc "SELECT CASE WHEN to_regclass('public.users') IS NOT NULL AND to_regclass('public.production_sessions') IS NOT NULL AND to_regclass('public.kb_chunks') IS NOT NULL THEN 1 ELSE 0 END");
        if [ "$$ok" = "1" ]; then echo "[migrate] schema cốt lõi OK"; else echo "[migrate] LỖI NGHIÊM TRỌNG: thiếu bảng cốt lõi"; exit 1; fi

  # ── Init hypertable TimescaleDB một lần (drizzle/timescale/*.sql qua psql). ─
  # Các file này KHÔNG do migrate-standalone apply (chạy trên container TSDB riêng).
  timescaledb-init:
    image: timescale/timescaledb:2.17.2-pg16
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGPASSWORD: ${TSDB_PASSWORD:-tsdb_pass}
    volumes:
      - ./drizzle/timescale:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "[tsdb-init] applying $$f";
          psql -h timescaledb -U ${TSDB_USER:-tsdb} -d ${TSDB_NAME:-avi_aoi_ts} -v ON_ERROR_STOP=1 -f "$$f";
        done
        echo "[tsdb-init] done";

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      timescaledb-init:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
    # Nạp TOÀN BỘ biến từ .env (credentials HiveMQ, cờ UNS/Sparkplug, SMTP, AI…).
    # Sau đó `environment` dưới đây OVERRIDE đúng các biến đặc thù mạng/đường dẫn docker:
    # giá trị trong .env là host-oriented (localhost) — KHÔNG đúng bên trong container.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000

      # --- Mạng nội bộ docker (ghi đè localhost trong .env → tên service) ---
      DATABASE_URL: postgres://${POSTGRES_USER:-aoi}:${POSTGRES_PASSWORD:-aoi}@postgres:5432/${POSTGRES_DB:-aoi_management}
      REDIS_URL: redis://redis:6379
      TSDB_URL: postgres://${TSDB_USER:-tsdb}:${TSDB_PASSWORD:-tsdb_pass}@timescaledb:5432/${TSDB_NAME:-avi_aoi_ts}
      # UNS broker = service EMQX (cổng container 1883). Trong .env là mqtt://localhost:1884 (host).
      UNS_BROKER_URL: mqtt://emqx:1883

      # --- Đường dẫn trong container ---
      LOCAL_STORAGE_DIR: /app/uploads
      LICENSE_FILE_PATH: /app/license.lic

      # --- Bắt buộc (fail-fast nếu thiếu trong .env) ---
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 64)}
      SIGNOFF_SECRET: ${SIGNOFF_SECRET:?set SIGNOFF_SECRET in .env (>=16 chars)}
      MASTER_API_KEY: ${MASTER_API_KEY:?set MASTER_API_KEY in .env}
      # Mặc định CORS cho cổng 3000 nếu .env chưa đặt ALLOWED_ORIGINS.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - appuploads:/app/uploads
      - appbackups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  # pgdata: volume PG16 cũ (pgvector/pgvector:pg16) — GIỮ để dump dữ liệu cũ khi
  # chuyển sang pgdata_ts theo scripts/migrate-to-timescaledb.md; xóa sau khi xong.
  pgdata:
  # pgdata_ts: dữ liệu PG17 + TimescaleDB (doc 27 quyết định #1).
  pgdata_ts:
  redisdata:
  appuploads:
  appbackups:
  emqxdata:
  tsdbdata:
  # natsdata: JetStream store (profile `bus` — chỉ tạo khi bật NATS, doc 44 G2.7/D2).
  natsdata:
