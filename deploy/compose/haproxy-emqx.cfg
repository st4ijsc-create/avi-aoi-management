# ─────────────────────────────────────────────────────────────────────────────
# SYN-W0 / G2.4 (doc 44) — HAProxy mẫu cho EMQX HA cluster 3 node (MQTT TCP LB).
# Dùng bởi service `haproxy` trong deploy/compose/docker-compose.uns-ha.yml
# (profile `lb`). Backend trỏ theo TÊN SERVICE compose (emqx1/2/3).
#
# Production: chạy ≥2 HAProxy + keepalived (VIP) — file này là mẫu 1 instance
# cho test/staging. TLS (MQTTS 8883): terminate ở EMQX (mode tcp passthrough,
# thêm frontend/backend 8883 tương tự) — KHÔNG terminate TLS ở HAProxy trừ khi
# chuyển cert vào đây có chủ đích.
# ─────────────────────────────────────────────────────────────────────────────

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    # MQTT giữ kết nối dài (keepalive) — timeout client/server phải LỚN HƠN
    # keepalive interval của client (app mqtt.js mặc định 60s) kẻo LB tự cắt.
    timeout client  300s
    timeout server  300s

# ── MQTT TCP: 1 cửa vào, roundrobin 3 node EMQX ──────────────────────────────
frontend mqtt_front
    bind *:1883
    default_backend mqtt_back

backend mqtt_back
    balance roundrobin
    # Health-check TCP thuần: node rớt (container stop / EMQX chết) bị loại khỏi
    # pool sau `fall` lần fail; quay lại sau `rise` lần OK. Client MQTT đứt kết
    # nối khi node chết sẽ reconnect qua LB và rơi vào node sống (session được
    # EMQX cluster chia sẻ).
    option tcp-check
    server emqx1 emqx1:1883 check inter 5s fall 3 rise 2
    server emqx2 emqx2:1883 check inter 5s fall 3 rise 2
    server emqx3 emqx3:1883 check inter 5s fall 3 rise 2

# ── Trang stats (theo dõi node up/down khi test failover) ────────────────────
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    # Test/staging không auth; production thêm: stats auth admin:<mật-khẩu-mạnh>
