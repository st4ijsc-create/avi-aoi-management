# ─────────────────────────────────────────────────────────────────────────────
# doc 48 R3 (G-L2) — MinIO as the COLD-TIER LAKE S3 target for the lake sink
# (server/services/streaming/lakeSink.ts).
#
# ADDITIVE + OPTIONAL. The lake sink defaults to LOCAL FS (LAKE_DIR=./data/lake) and
# needs NOTHING here to run. Start this ONLY when you want an S3/object-store cold
# tier (MinIO = S3-compatible, self-hosted). It does not touch the main compose.
#
# Chạy / Run:
#   docker compose -f deploy/compose/docker-compose.lake.yml up -d
#   # MinIO API  → http://127.0.0.1:9000   Console → http://127.0.0.1:9001
#   # (login: MINIO_ROOT_USER / MINIO_ROOT_PASSWORD — set below, CHANGE for prod)
#
# Then point the sink at it (in .env), keep the flag OFF until the orchestrator flips it:
#   LAKE_SINK_ENABLED=true            # orchestrator-controlled
#   STREAM_BRIDGE_BACKEND=nats        # durable tier (NATS JetStream)
#   NATS_URL=nats://127.0.0.1:4222
#   LAKE_S3_ENDPOINT=http://127.0.0.1:9000
#   LAKE_S3_BUCKET=synapse-lake
#   LAKE_S3_ACCESS_KEY=synapse        # = MINIO_ROOT_USER (or a scoped key)
#   LAKE_S3_SECRET_KEY=synapse-secret # = MINIO_ROOT_PASSWORD
#   LAKE_S3_FORCE_PATH_STYLE=true     # REQUIRED for MinIO
#   LAKE_S3_REGION=us-east-1
#   # LAKE_S3_PREFIX=telemetry        # optional key prefix
#
# Prove it: `npm run lake:verify` writes a synthetic partition file (set
#   LAKE_VERIFY_USE_S3=1 to exercise the S3 path instead of local FS).
#
# ⚠️ SECRET: the credentials below are DEV DEFAULTS. Override MINIO_ROOT_USER /
#   MINIO_ROOT_PASSWORD (and the matching LAKE_S3_* keys) before any shared/prod use.
# ⚠️ LICENSE: MinIO server is AGPL-3.0 — fine self-hosted; review before redistributing.
# ─────────────────────────────────────────────────────────────────────────────

services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z  # PIN — do not float `latest`
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synapse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-synapse-secret}
    ports:
      - "9000:9000"   # S3 API  (LAKE_S3_ENDPOINT=http://127.0.0.1:9000)
      - "9001:9001"   # Web console
    volumes:
      - lakedata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  # One-shot: create the lake bucket so the sink can PutObject immediately.
  createbuckets:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set lake http://minio:9000 ${MINIO_ROOT_USER:-synapse} ${MINIO_ROOT_PASSWORD:-synapse-secret} &&
      mc mb --ignore-existing lake/${LAKE_S3_BUCKET:-synapse-lake} &&
      echo 'lake bucket ready: ${LAKE_S3_BUCKET:-synapse-lake}';
      "

volumes:
  lakedata:
