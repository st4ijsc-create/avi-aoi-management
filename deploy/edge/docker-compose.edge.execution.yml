# ─────────────────────────────────────────────────────────────────────────────
# OVERLAY — turns edge RUN EXECUTION on (doc 81 Dot 9 S, docs/EDGE_GATEWAY.md section 8).
#
#   docker compose -f deploy/edge/docker-compose.edge.yml -f deploy/edge/docker-compose.edge.execution.yml \
#     --env-file .env.edge up -d
#
# doc 81 Dot 10: the node credential + keyset pin secrets, EDGE_CENTRAL_URL / node id / credential id and the journal are in
# the BASE file now (every v2 edge speaks the node protocol, run execution or not). This overlay only turns execution on.
# Every non-STOP step is authorised by central (signed, single-use, 10 s TTL from the edge's own request); central down ⇒
# non-STOP steps are HELD (D5), STOPs still go out (L-7). Turn it on only after the dot10 E2E + attack suites are green.
# ─────────────────────────────────────────────────────────────────────────────
services:
  edge-gateway:
    environment:
      EDGE_EXECUTION_ENABLED: "true"
      FOE_ENABLED: "true"
      ROBOT_GATEWAY_ENABLED: ${ROBOT_GATEWAY_ENABLED:-false}
