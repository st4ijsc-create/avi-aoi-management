# ─────────────────────────────────────────────────────────────────────────────
# SYNAPSE EDGE GATEWAY — one gateway per LINE, deployed AT THE EDGE (doc 44 W7-1,
# gap G1.14, SYNAPSE Tầng-1 §5.2 "mô hình triển khai").
#
# This is NOT the central platform. It runs ONE process — the edge gateway
# (dist/edgeGatewayMain.js) — near the devices of a single line/cell:
#   • southbound: OT adapters (otManager + ConnectionSupervisor)  [OT_GATEWAY_ENABLED]
#   • northbound: UNS bridge (Sparkplug/normalized) to the CENTRAL broker
#   • autonomy:   store-and-forward WAL (≥24h) when the central broker is unreachable
# It binds NO HTTP API / Socket.IO and, by default, NO local broker.
#
# Deploy one stack PER NODE. Point UNS_BROKER_URL at the central EMQX (deploy/emqx).
#
# doc 81 Dot 10 — NO CENTRAL DB ON THE EDGE: this host holds no DATABASE_URL, no JWT_SECRET and no
# SECRET_ENCRYPTION_KEY. Identity, owned devices (with their secrets, sealed for this node) and run packages
# come from CENTRAL over the node protocol (/api/v1/edge/node/*), SIGNED and verified against the keyset PIN;
# local state lives in the journal (EDGE_JOURNAL_DIR, on the edgedata volume). The node bundle
# (scripts/edge-node-credential.ts issue --bundle DIR) gives the credential file, the pin and edge-node.env.
#
# Run:
#   docker compose -f deploy/edge/docker-compose.edge.yml --env-file .env.edge --env-file edge-node.env up -d
#   (.env.edge from deploy/edge/.env.edge.example; edge-node.env from the bundle)
#
# ⚠️ SAFETY: with THIS file alone the gateway is READ + publish + buffer only.
#    With the execution overlay (docker-compose.edge.execution.yml, doc 81 Dot 9 S —
#    docs/EDGE_GATEWAY.md section 8) it ALSO executes the runs central assigns to this
#    node: it dispatches OT writes and robot motion to THIS node's devices (its own
#    lines only), through the same gates as central (approval, binding digest,
#    program checksum, interlocks, safety preflight, motion lock — STOPs exempt).
#    Either way it runs on the edge server, SEPARATE from the certified safety-PLC —
#    it never writes safety functions (SYNAPSE Tầng-1 §18 "ranh giới an toàn").
# ─────────────────────────────────────────────────────────────────────────────
services:
  # OPTIONAL embedded broker at the edge (store-and-forward store, or a local UNS
  # island). Disabled by default — the gateway publishes straight to the central
  # broker (UNS_BROKER_URL). Enable with:  docker compose --profile embedded-broker up
  edge-broker:
    image: emqx/emqx:5.8
    profiles: ["embedded-broker"]
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: ${EDGE_BROKER_COOKIE:-edgecookie}
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  edge-gateway:
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile.edge
    image: synapse-edge-gateway:latest
    restart: unless-stopped
    # No ports published — the gateway binds no HTTP/socket. Egress only: UNS broker + central HTTPS (no DB).
    env_file:
      - ../../.env.edge
    environment:
      NODE_ENV: production

      # ── Edge-gateway mode (activates the autonomous-edge behaviours) ──
      EDGE_GATEWAY_MODE: "true"
      AVI_PROCESS_ROLE: edge                       # every central-DB accessor refuses (doc 81 Dot 10 §2.15)
      EDGE_RUNTIME_ENABLED: "true"                 # node protocol: heartbeat, config, commands (STOPs)
      EDGE_GATEWAY_NODE_CODE: ${EDGE_GATEWAY_NODE_CODE:-edge-line1}   # Sparkplug edge-node id only; identity is central's
      EDGE_GATEWAY_HEARTBEAT_INTERVAL_MS: "30000"

      # ── Node protocol (doc 81 Dot 10) — from the node bundle (edge-node.env). Missing ⇒ the gateway starts NO device. ──
      EDGE_CENTRAL_URL: ${EDGE_CENTRAL_URL:?set EDGE_CENTRAL_URL to the central server (https://...)}
      EDGE_CENTRAL_NODE_ID: ${EDGE_CENTRAL_NODE_ID:?set EDGE_CENTRAL_NODE_ID (edge_nodes id, from the node bundle)}
      EDGE_CENTRAL_CREDENTIAL_ID: ${EDGE_CENTRAL_CREDENTIAL_ID:?set EDGE_CENTRAL_CREDENTIAL_ID (from the node bundle)}
      # only the PATHS of the two files — the credential never goes into the environment
      EDGE_NODE_CREDENTIAL_FILE: /run/secrets/edge_node_credential
      EDGE_KEYSET_PIN_FILE: /run/secrets/edge_keyset_pin
      # local journal (append-only JSONL + fsync; auth / step / STOP / lock records are never dropped — size it, §8)
      EDGE_JOURNAL_DIR: /app/data/edge-journal
      EDGE_JOURNAL_MAX_BYTES: ${EDGE_JOURNAL_MAX_BYTES:-67108864}

      # ── Southbound (OT adapters — the devices central's signed config says this node OWNS) ──
      OT_GATEWAY_ENABLED: "true"
      OT_CONN_HA_ENABLED: "true"                   # reconnect + dual-endpoint failover
      OT_STORE_FORWARD_ENABLED: "true"             # telemetry buffer while central is unreachable (local persist path)
      OT_INGEST_TO_UNS: "true"                     # publish samples northbound to UNS

      # ── Northbound (central UNS broker) ──
      UNS_BRIDGE_ENABLED: "true"
      UNS_SPARKPLUG_ENABLED: "true"                # this gateway = one Sparkplug Edge Node
      UNS_BROKER_URL: ${UNS_BROKER_URL:?set UNS_BROKER_URL to the CENTRAL EMQX (e.g. mqtts://central:8883)}
      UNS_BROKER_USERNAME: ${UNS_BROKER_USERNAME:-}
      UNS_BROKER_PASSWORD: ${UNS_BROKER_PASSWORD:-}
      UNS_SPARKPLUG_EDGE_NODE_ID: ${EDGE_GATEWAY_NODE_CODE:-edge-line1}

      # ── Edge autonomy: store-and-forward WAL (≥24h) when central unreachable ──
      EDGE_UNS_STORE_FORWARD_FILE: /app/data/edge-uns-store-forward.jsonl
      EDGE_UNS_STORE_FORWARD_MAX_AGE_MS: "86400000"   # 24h
      EDGE_UNS_STORE_FORWARD_DRAIN_MS: "30000"
      EDGE_GATEWAY_LIVENESS_FILE: /app/data/edge-gateway.alive

      # ── Run EXECUTION (non-STOP actuation under central's per-step signed authorisation) is OFF in this file.
      #    To turn it on, add the overlay docker-compose.edge.execution.yml (docs/EDGE_GATEWAY.md section 8).
      # NO DATABASE_URL / JWT_SECRET / SECRET_ENCRYPTION_KEY here or in .env.edge (Dot 10 cutover: remove them, rotate the
      # avi_app password, firewall :5432 from the edge subnet — docs/EDGE_GATEWAY.md section 8.6).
    secrets:
      - edge_node_credential
      - edge_keyset_pin
    volumes:
      # Durable WAL + journal + liveness marker survive restarts (≥24h backlog).
      - edgedata:/app/data

# Compose FILE-BASED secrets: both files live OUTSIDE the repo checkout (e.g. /etc/avi-edge/, mode 700 dir), owned by the
# container's `app` user. The credential must be mode 600 (the gateway refuses a group / world-readable one); the pin is
# public data but its INTEGRITY is the root of trust (mode 444, never writable by the gateway).
secrets:
  edge_node_credential:
    file: ${EDGE_NODE_CREDENTIAL_HOST_FILE:?set EDGE_NODE_CREDENTIAL_HOST_FILE to the node credential file OUTSIDE the repo checkout (mode 600)}
  edge_keyset_pin:
    file: ${EDGE_KEYSET_PIN_HOST_FILE:?set EDGE_KEYSET_PIN_HOST_FILE to edge-keyset.json from the node bundle (mode 444)}

volumes:
  edgedata:
