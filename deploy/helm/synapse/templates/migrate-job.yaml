{{- if .Values.migrations.enabled -}}
{{/*
One-shot schema migration — doc 33 §11 / ADR-007. Helm pre-install/pre-upgrade hook.
Mirrors the compose `migrate` service: run scripts/migrate-standalone.mjs (lenient — some
legacy/idempotent files warn, expected) then VERIFY the core tables exist. Needs DATABASE_URL
from the Secret; the image ships postgresql-client + the scripts/ dir.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "synapse.fullname" . }}-migrate
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "synapse.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "synapse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: {{ include "synapse.secretName" . }}
          # Keep tini entrypoint; run the migrate script + core-table verify via sh.
          args:
            - /bin/sh
            - -c
            - |
              set -u
              echo "[migrate] waiting for database…"
              until pg_isready -d "$DATABASE_URL" >/dev/null 2>&1; do sleep 2; done
              node scripts/migrate-standalone.mjs || echo "[migrate] some legacy/idempotent files reported errors (expected) — verifying core schema…"
              ok=$(psql "$DATABASE_URL" -tAc "SELECT CASE WHEN to_regclass('public.users') IS NOT NULL AND to_regclass('public.production_sessions') IS NOT NULL THEN 1 ELSE 0 END")
              if [ "$ok" = "1" ]; then echo "[migrate] core schema OK"; else echo "[migrate] FATAL: core tables missing"; exit 1; fi
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
