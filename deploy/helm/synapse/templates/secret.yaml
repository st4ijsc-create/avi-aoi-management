{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synapse.fullname" . }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
type: Opaque
# ⚠️  PROVIDE THESE AT INSTALL — never commit real secrets. e.g.:
#   --set-string secrets.databaseUrl='postgres://…' --set-string secrets.jwtSecret="$(openssl rand -base64 64)"
# For production prefer `existingSecret` (chart renders nothing) backed by an
# ExternalSecret operator (Vault / AWS Secrets Manager). Site edition points these
# at EXTERNAL managed Postgres / TimescaleDB / EMQX / Redis (ADR-007 profile).
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- if .Values.secrets.tsdbUrl }}
  TSDB_URL: {{ .Values.secrets.tsdbUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.unsBrokerUrl }}
  UNS_BROKER_URL: {{ .Values.secrets.unsBrokerUrl | quote }}
  {{- end }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SIGNOFF_SECRET: {{ .Values.secrets.signoffSecret | quote }}
  MASTER_API_KEY: {{ .Values.secrets.masterApiKey | quote }}
{{- end }}
