{{- if .Values.worker.enabled -}}
{{/*
SYNAPSE worker (ROLE=worker · node dist/worker.js) — doc 33 §11 / ADR-007 · doc 27 B7.
Runs ONLY the cron/scheduler jobs (reports, backups, retention, integrity scan, AI cron,
ERP outbox drain, …); no HTTP bind → no Service, no HTTP probes.
SINGLE INSTANCE: replicas is HARD-CODED to 1 (no leader election yet — two workers would
double-run every job). Not exposed as a value on purpose; not targeted by the HPA.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse.fullname" . }}-worker
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate # never run two workers side-by-side during a rollout
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "synapse.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "synapse.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "synapse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Keep the image's tini entrypoint; only swap the CMD to the worker entry.
          args:
            - node
            - dist/worker.js
          env:
            - name: ROLE
              value: worker
          envFrom:
            - configMapRef:
                name: {{ include "synapse.fullname" . }}
            - secretRef:
                name: {{ include "synapse.secretName" . }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/uploads
              subPath: uploads
            - name: data
              mountPath: /app/backups
              subPath: backups
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "synapse.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
