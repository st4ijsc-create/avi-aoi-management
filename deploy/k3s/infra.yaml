# =============================================================================
# SYNAPSE — Line/edge CO-LOCATED infra. doc 33 §11 / ADR-007.
# Single-node K3s appliance: one Postgres (TimescaleDB + pgvector, same image as the
# Site/Machine compose) + one Redis (BullMQ/outbox). This is the "embedded-ish" edge
# profile — infra runs next to the app on the same node. For a Site cluster use external
# managed services via the Helm chart instead.
# Default creds aoi/aoi/aoi_management match .env.example; install-edge.sh wires the app's
# DATABASE_URL secret to `synapse-postgres` accordingly.
# =============================================================================
---
# Bootstrap the `vector` + `timescaledb` extensions BEFORE any migration runs — mirrors
# deploy/postgres-init/00-extensions.sql (0009 uses vector(1024); 0172 needs timescaledb).
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-postgres-init
  namespace: synapse-edge
  labels:
    app.kubernetes.io/part-of: synapse
data:
  00-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    DO $$
    BEGIN
      IF EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'timescaledb') THEN
        CREATE EXTENSION IF NOT EXISTS timescaledb;
      ELSE
        RAISE WARNING 'timescaledb extension not available on this image';
      END IF;
    END $$;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-postgres-data
  namespace: synapse-edge
  labels:
    app.kubernetes.io/part-of: synapse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName omitted → K3s default (local-path).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-postgres
  namespace: synapse-edge
  labels:
    app.kubernetes.io/name: synapse-postgres
    app.kubernetes.io/part-of: synapse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-postgres
        app.kubernetes.io/part-of: synapse
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb-ha:pg17
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: aoi
            - name: POSTGRES_PASSWORD
              value: aoi
            - name: POSTGRES_DB
              value: aoi_management
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aoi", "-d", "aoi_management"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aoi", "-d", "aoi_management"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /home/postgres/pgdata/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: synapse-postgres-data
        - name: init
          configMap:
            name: synapse-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-postgres
  namespace: synapse-edge
  labels:
    app.kubernetes.io/name: synapse-postgres
    app.kubernetes.io/part-of: synapse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: synapse-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-redis
  namespace: synapse-edge
  labels:
    app.kubernetes.io/name: synapse-redis
    app.kubernetes.io/part-of: synapse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-redis
        app.kubernetes.io/part-of: synapse
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        # emptyDir: edge tolerates a Redis reset (BullMQ jobs re-enqueue). Swap for a PVC
        # if you need queue durability across pod restarts.
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-redis
  namespace: synapse-edge
  labels:
    app.kubernetes.io/name: synapse-redis
    app.kubernetes.io/part-of: synapse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: synapse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
