# doc 33 W5 / ADR-006 — SYNAPSE Machine Edition desktop shell (Tauri 2). SCAFFOLD.
# Requires the Rust toolchain + `cargo install tauri-cli` to build (not built in this env).
[package]
name = "synapse-machine-shell"
version = "0.1.0"
description = "SYNAPSE Machine Edition desktop kiosk (wraps the web Control Tower)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
