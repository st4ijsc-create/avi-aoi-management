# Phase 1 WS1.5 — Optional observability stack (Prometheus + Grafana).
#
# Usage:
#   docker compose -f monitoring/docker-compose.observability.yml up -d
#
# Then enable metrics in the app:
#   1) Install the metrics dependency:  pnpm add prom-client
#   2) Set METRICS_ENABLED=true in the app .env and restart.
#   3) Grafana at http://localhost:3001 (admin/admin) — dashboard "AVI-AOI — Service Overview".
#
# Prometheus scrapes the app at host.docker.internal:3000 by default
# (see monitoring/prometheus/prometheus.yml). Adjust for your topology.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: avi-aoi-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: avi-aoi-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus-data:
  grafana-data:
